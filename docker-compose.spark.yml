# spark: 1 master + 2 workers (4 cpu, 3 GB each, same as ray)
name: a3-spark
services:
  spark-master:
    image: a3-cluster:3.3.4
    container_name: spark_master
    hostname: spark-master
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # cluster port
      - "4040:4040"   # application UI (driver runs here)
    volumes:
      - ./:/opt/a3
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_WORKLOAD=master
      - PYTHONPATH=/opt/a3
    cpus: 2
    mem_limit: 2g

  spark-worker-a:
    image: a3-cluster:3.3.4
    container_name: spark_worker_a
    hostname: spark-worker-a
    ports:
      - "8081:8080"   # worker A UI
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker-a
      - PYTHONPATH=/opt/a3
    volumes:
      - ./:/opt/a3
    cpus: 4
    mem_limit: 3g

  spark-worker-b:
    image: a3-cluster:3.3.4
    container_name: spark_worker_b
    hostname: spark-worker-b
    ports:
      - "8082:8080"   # worker B UI
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker-b
      - PYTHONPATH=/opt/a3
    volumes:
      - ./:/opt/a3
    cpus: 4
    mem_limit: 3g
